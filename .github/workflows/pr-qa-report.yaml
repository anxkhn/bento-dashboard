name: PR QA Report

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa-report:
    name: QA PDF report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Run PR QA workflow
        env:
          QA_REPORT_BROWSER: /usr/bin/chromium-browser
          QA_FAIL_CI: "1"
        run: |
          if [ ! -x "$QA_REPORT_BROWSER" ]; then
            if [ -x /usr/bin/chromium ]; then
              export QA_REPORT_BROWSER=/usr/bin/chromium
            fi
          fi
          node scripts/qa-report/run-workflow.mjs

      - name: Upload QA report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-qa-report-${{ github.event.pull_request.number }}
          path: |
            outputs/qa-reports/*.pdf
            outputs/qa-reports/*.html
            outputs/qa-reports/*.json
          if-no-files-found: warn

      - name: Comment QA summary on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'outputs/qa-reports';
            if (!fs.existsSync(dir)) {
              core.warning('No QA report directory found');
              return;
            }
            const jsons = fs.readdirSync(dir).filter((f) => f.endsWith('.json')).sort();
            if (!jsons.length) {
              core.warning('No QA JSON report found');
              return;
            }
            const report = JSON.parse(fs.readFileSync(path.join(dir, jsons[jsons.length - 1]), 'utf8'));
            const risks = (report.topRisks || []).map((r) => `- ${r}`).join('\n') || '- None';
            const body = [
              '## PR QA Report',
              '',
              `**Status:** \`${report.overallStatus}\``,
              `**Branch:** \`${context.payload.pull_request.head.ref}\` → \`main\``,
              `**Generated:** ${report.generatedAt || 'n/a'}`,
              '',
              '### Top risks',
              risks,
              '',
              '_Full PDF/HTML/JSON available in the workflow Artifacts tab._',
              '',
              '<!-- bento-pr-qa-report -->',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) =>
              (c.body || '').includes('<!-- bento-pr-qa-report -->')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
